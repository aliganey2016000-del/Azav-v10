<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Orthopedic bone and joint illustration</title>
  <desc id="desc">A clean medical illustration of a long bone, joint, and X-ray grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2f5"/>
      <stop offset="1" stop-color="#c7d9df"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.55" stop-color="#f0dfb0"/>
      <stop offset="1" stop-color="#c59b4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#173047" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#background)"/>
  <g opacity=".18" stroke="#496b78" stroke-width="2">
