    <path d="M184 185c-38-31-77 22-45 55l39 40c13 14 14 36 2 52l-17 24c-19 27 20 67 47 48l57-40c20-14 47-13 65 3l75 67c31 28 77-18 49-49l-68-75c-17-19-18-47-3-68l37-51c21-29-22-70-51-49l-51 37c-20 15-47 15-67 1z" fill="url(#bone)" stroke="#927331" stroke-width="8"/>
    <path d="M354 265l54-55" stroke="#b34f43" stroke-width="12" stroke-linecap="round"/>
    <path d="M335 287l45-48" stroke="#fff9df" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <circle cx="273" cy="254" r="38" fill="#d5b56d" stroke="#927331" stroke-width="7"/>
    <circle cx="273" cy="254" r="17" fill="#f8f5e7"/>
    <path d="M196 196c-12 11-11 27 2 40M449 331c12-11 12-27 0-40" fill="none" stroke="#fff9df" stroke-width="9" stroke-linecap="round" opacity=".75"/>
