server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate the entry document after a deployment.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Missing bundles must never fall back to HTML.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
